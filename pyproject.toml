[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdoc"
version = "1.8.0"
description = "MCP server for RAG document search with contextualized embeddings"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Research Assistant", email = "research@example.com"}
]

dependencies = [
    "fastmcp>=4.0.4,<5",
    "pydantic>=2.11.7,<3",
    "chromadb>=1.5.9,<2",
    "numpy>=1.26",
    "voyageai>=0.3.5",
    "cohere>=5.0.0",
    "python-dotenv>=1.0.0",
    "chonkie>=1.7.0,<2",
    "pyyaml>=6.0.0",
    "rank-bm25>=0.2.2",
    "nltk>=3.9,<4",
    "requests>=2.31,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
ragdoc = "src.server:main"

[tool.setuptools.packages.find]
include = ["src*"]
